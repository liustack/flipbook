<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>postman: a light in the window, sprite frames</title>
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #d3dadb; }
  canvas { position: absolute; left: 0; top: 0; }
  #morning { position: absolute; left: 0; width: 100%; margin: 0; text-align: center; opacity: 0;
             top: 13%; font: 400 calc(96px * var(--u, 1))/1.2 "LXGW WenKai"; color: #2a2320; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<p id="morning">早安</p>
<script type="module">
import {
  boil, composition, cueProgress, drawPaper, ease, grainLayer, loadSprite, onTwos, progress,
  rand, setupCanvas, sprite, staticLayer, timeline,
} from '/__flipbook/runtime.js';

const tl = await timeline();
const W = tl.width;
const H = tl.height;
const U = Math.min(W, H) / 1080;
document.documentElement.style.setProperty('--u', String(U));
const ctx = setupCanvas(document.getElementById('stage'), W, H);
const morning = document.getElementById('morning');
const [streetScene, lightScene, helloScene] = tl.scenes;

// ---------------------------------------------------------------------------
// The postman: whole drawings from two generated sheets, cut by flipbook sprite.

const clips = await loadSprite('assets/sprites/postman/clips.json');
const man = sprite(clips, { scale: 0.82 * U });

const FLOOR = 930 * U;
// Five passes of the walk (ten steps), ending just after the window lights.
const WALK_START = 0.2;
const PASSES = 5;
const WALK_END = WALK_START + PASSES * man.duration('walk');
const STOP_X = 930 * U;
const START_X = STOP_X - man.distance('walk', PASSES * man.duration('walk'));

// His wave, paced by hand: raise the arm, open hand out and in, lower it.
// [seconds after he starts, drawing]
const WAVE_START = helloScene.start + 0.8;
const WAVE = [[0, 1], [0.125, 2], [0.3, 3]];
for (let k = 0; k < 11; k++) WAVE.push([0.45 + k * 0.15, k % 2 === 0 ? 4 : 3]);
WAVE.push([0.45 + 11 * 0.15 + 0.1, 5], [0.45 + 11 * 0.15 + 0.3, 0]);

function postman(t) {
  if (t < WALK_END) {
    const u = Math.max(0, t - WALK_START);
    return { x: START_X + man.distance('walk', u), draw: { clip: 'walk', t: u } };
  }
  let frame = 0;
  for (const [at, i] of WAVE) if (t >= WAVE_START + at) frame = i;
  return { x: STOP_X, draw: { clip: 'wave', frame } };
}

// ---------------------------------------------------------------------------
// The street: a row of house fronts, their windows dark. One of them lights.

const WINDOW_Y = 400 * U;
const WINDOW_H = 220 * U;
const WINDOW_W = 180 * U;
const WINDOWS = [150, 520, 1300, 1690].map((x) => x * U);
const LIT = WINDOWS[2];
const LIGHT_AT = lightScene.start + (0.5 * 60) / tl.bpm;
const CHILD_AT = LIGHT_AT + 0.7;

function windowFrame(c, x, fill) {
  c.fillStyle = fill;
  c.fillRect(x, WINDOW_Y, WINDOW_W, WINDOW_H);
  c.strokeStyle = '#ece4d2';
  c.lineWidth = 9 * U;
  c.strokeRect(x, WINDOW_Y, WINDOW_W, WINDOW_H);
  c.lineWidth = 6 * U;
  c.beginPath();
  c.moveTo(x + WINDOW_W / 2, WINDOW_Y);
  c.lineTo(x + WINDOW_W / 2, WINDOW_Y + WINDOW_H);
  c.moveTo(x, WINDOW_Y + WINDOW_H * 0.45);
  c.lineTo(x + WINDOW_W, WINDOW_Y + WINDOW_H * 0.45);
  c.stroke();
  // The sill.
  c.fillStyle = '#ece4d2';
  c.fillRect(x - 14 * U, WINDOW_Y + WINDOW_H, WINDOW_W + 28 * U, 14 * U);
  c.strokeStyle = 'rgba(42, 35, 32, 0.5)';
  c.lineWidth = 2 * U;
  c.strokeRect(x - 14 * U, WINDOW_Y + WINDOW_H, WINDOW_W + 28 * U, 14 * U);
}

let street;
let litWindow;
function tornEdge(c, y0, amp, seed, step) {
  c.lineTo(W + 10, y0);
  for (let x = W + 10; x >= -10; x -= step) {
    c.lineTo(x, y0 + (rand(seed, 'edge', Math.round(x)) - 0.5) * amp);
  }
}

// The child in the lit window: a cut-paper silhouette rising into view, then waving.
function child(c, t) {
  const up = ease.outBack(progress(t, CHILD_AT, CHILD_AT + 0.45));
  if (up <= 0) return;
  const cx = LIT + WINDOW_W * 0.4;
  const sill = WINDOW_Y + WINDOW_H;
  const headY = sill - 150 * U + (1 - up) * 170 * U;
  c.save();
  c.beginPath();
  c.rect(LIT, WINDOW_Y, WINDOW_W, WINDOW_H);
  c.clip();
  c.fillStyle = '#2a2320';
  // Head, then shoulders down past the sill.
  c.beginPath();
  c.arc(cx, headY, 40 * U, 0, Math.PI * 2);
  c.fill();
  c.beginPath();
  c.roundRect(cx - 52 * U, headY + 38 * U, 104 * U, 200 * U, [36 * U, 36 * U, 0, 0]);
  c.fill();
  // A ponytail tied at one side, and a bow on it.
  c.beginPath();
  c.ellipse(cx - 44 * U, headY + 8 * U, 12 * U, 20 * U, 0.35, 0, Math.PI * 2);
  c.fill();
  c.beginPath();
  c.moveTo(cx - 34 * U, headY - 14 * U);
  c.lineTo(cx - 52 * U, headY - 26 * U);
  c.lineTo(cx - 50 * U, headY - 4 * U);
  c.closePath();
  c.fill();
  // The waving arm: from the far shoulder, swinging side to side.
  const waving = t >= helloScene.start && t < tl.durationSec - 0.5;
  const raise = waving ? 1 : ease.outCubic(progress(t, CHILD_AT + 0.6, CHILD_AT + 1.2)) * 0.3;
  const swing = waving ? Math.sin((t - helloScene.start) * Math.PI * 2 * 1.6) * 0.45 : 0;
  // The arm is drawn hanging down: a half turn less a little holds it up and out.
  const angle = -raise * (Math.PI - 0.35) + swing * raise;
  c.save();
  c.translate(cx + 36 * U, headY + 60 * U);
  c.rotate(angle);
  c.beginPath();
  c.roundRect(-15 * U, -8 * U, 30 * U, 92 * U, 15 * U);
  c.fill();
  c.beginPath();
  c.arc(0, 94 * U, 20 * U, 0, Math.PI * 2);
  c.fill();
  c.restore();
  c.restore();
}

composition({
  setup() {
    street = staticLayer(W, H, (c) => {
      drawPaper(c, W, H, { seed: tl.seed, color: '#d3dadb', mottle: 1.3, fibers: 1.1 });
      // House fronts: flat walls with a torn roofline, one tone per house.
      let x = -30 * U;
      let i = 0;
      while (x < W + 30) {
        const w = (360 + rand(tl.seed, 'house-w', i) * 160) * U;
        const top = (250 + rand(tl.seed, 'house-h', i) * 70) * U;
        c.save();
        c.beginPath();
        c.moveTo(x, FLOOR);
        c.lineTo(x, top);
        for (let s = 0; s <= w; s += 16 * U) {
          c.lineTo(x + s, top + (rand(tl.seed, 'roof', i * 100 + s) - 0.5) * 6 * U);
        }
        c.lineTo(x + w, FLOOR);
        c.closePath();
        c.clip();
        const tones = ['#9aa5aa', '#a9b0ac', '#8f9da6'];
        drawPaper(c, W, H, { seed: tl.seed + 10 + i, color: tones[i % 3], mottle: 1.3, fibers: 1 });
        c.restore();
        c.strokeStyle = 'rgba(42, 35, 32, 0.35)';
        c.lineWidth = 2 * U;
        c.beginPath();
        c.moveTo(x + w, top);
        c.lineTo(x + w, FLOOR);
        c.stroke();
        x += w;
        i += 1;
      }
      for (const wx of WINDOWS) windowFrame(c, wx, '#34404e');
      // The pavement in front, torn along its top edge.
      c.save();
      c.beginPath();
      c.moveTo(-10, H + 10);
      c.lineTo(-10, FLOOR - 14 * U);
      tornEdge(c, FLOOR - 14 * U, 8 * U, tl.seed + 2, 18 * U);
      c.lineTo(W + 10, FLOOR - 14 * U);
      c.lineTo(W + 10, H + 10);
      c.closePath();
      c.clip();
      drawPaper(c, W, H, { seed: tl.seed + 3, color: '#c9bb9f', mottle: 1.5, fibers: 1.6 });
      c.restore();
      c.strokeStyle = 'rgba(42, 35, 32, 0.4)';
      c.lineWidth = 2;
      c.beginPath();
      c.moveTo(0, FLOOR + 70 * U);
      c.lineTo(W, FLOOR + 70 * U);
      c.stroke();
    });
    litWindow = staticLayer(W, H, (c) => {
      // Warm light across the pavement below the window.
      c.fillStyle = 'rgba(246, 206, 120, 0.28)';
      c.beginPath();
      c.moveTo(LIT - 30 * U, FLOOR - 14 * U);
      c.lineTo(LIT + WINDOW_W + 30 * U, FLOOR - 14 * U);
      c.lineTo(LIT + WINDOW_W + 140 * U, H);
      c.lineTo(LIT - 140 * U, H);
      c.closePath();
      c.fill();
      c.save();
      c.beginPath();
      c.rect(LIT, WINDOW_Y, WINDOW_W, WINDOW_H);
      c.clip();
      drawPaper(c, W, H, { seed: tl.seed + 5, color: '#f2c766', mottle: 1.4, fibers: 1.2 });
      c.restore();
    });
    grainLayer(W, H, { seed: tl.seed, amount: 0.7 });
  },
  seek(time) {
    // Shot on twos: the whole picture shifts a hair between drawings.
    const t = onTwos(time, tl.fps);
    const b = boil(t, tl.fps, { seed: 'street', amount: 1.2, turn: 0.1 });
    ctx.save();
    ctx.clearRect(0, 0, W, H);
    ctx.translate(b.x * U, b.y * U);
    ctx.rotate(b.rotate);
    street.blit(ctx);
    // The light comes on with one flicker.
    const on = t >= LIGHT_AT && !(t >= LIGHT_AT + 0.08 && t < LIGHT_AT + 0.17);
    if (on) {
      litWindow.blit(ctx);
      child(ctx, t);
      // The window frame over the light and the child.
      ctx.save();
      ctx.beginPath();
      ctx.rect(LIT - 20 * U, WINDOW_Y - 10 * U, WINDOW_W + 40 * U, WINDOW_H + 40 * U);
      ctx.clip();
      windowFrame(ctx, LIT, 'rgba(0, 0, 0, 0)');
      ctx.restore();
    }
    const p = postman(t);
    ctx.save();
    ctx.shadowColor = 'rgba(42, 35, 32, 0.25)';
    ctx.shadowBlur = 10 * U;
    ctx.shadowOffsetX = 6 * U;
    ctx.shadowOffsetY = 8 * U;
    man.draw(ctx, p.x, FLOOR, p.draw);
    ctx.restore();
    ctx.restore();
    const a = ease.outCubic(cueProgress(tl, time, 'morning'));
    morning.style.opacity = String(a);
    morning.style.transform = `translateY(${(1 - a) * 12 * U}px)`;
  },
});
</script>
</body>
</html>
