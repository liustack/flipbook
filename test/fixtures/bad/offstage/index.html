<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 640px; height: 360px; overflow: hidden; background: #ffffff; }
  canvas { position: absolute; left: 0; top: 0; }
  p { position: absolute; margin: 0; font: 400 36px/1.2 "Noto Serif SC"; white-space: nowrap; color: #222; }
  #cut { left: 520px; top: 40px; }
  #edge { left: 8px; top: 130px; }
  #exempt { left: 500px; top: 220px; }
  #gone { left: 700px; top: 280px; }
</style>
</head>
<body>
<p id="cut">Cut off text</p>
<p id="edge">Near edge</p>
<p id="exempt" data-flipbook-allow-overflow>Bleeds on purpose</p>
<p id="gone">Entirely off the frame</p>
<canvas id="ink"></canvas>
<script type="module">
import { composition, setupCanvas } from '/__flipbook/runtime.js';
const ink = setupCanvas(document.getElementById('ink'), 640, 360);
composition({
  seek(t) {
    ink.clearRect(0, 0, 640, 360);
    ink.fillStyle = '#2a6f97';
    ink.fillRect(200 + t * 40, 300, 40, 40);
  },
});
</script>
</body>
</html>
