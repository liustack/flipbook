<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 640px; height: 360px; overflow: hidden; background: #ffffff; }
  canvas { position: absolute; left: 0; top: 0; }
</style>
</head>
<body>
<canvas id="ink"></canvas>
<script type="module">
import { composition, setupCanvas } from '/__flipbook/runtime.js';
const ink = setupCanvas(document.getElementById('ink'), 640, 360);
const load = async (src) => { const img = new Image(); img.src = src; await img.decode(); return img; };
const [leaf, stone] = await Promise.all([load('assets/leaf.png'), load('assets/stone.png')]);
composition({
  seek(t) {
    ink.clearRect(0, 0, 640, 360);
    ink.drawImage(leaf, 40 + t * 120, 120, 80, 80);
    ink.drawImage(stone, 400, 140 + t * 20, 80, 80);
  },
});
</script>
</body>
</html>
