<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 640px; height: 360px; overflow: hidden; background: #efe6d2; }
  canvas, #fill { position: absolute; left: 0; top: 0; width: 640px; height: 360px; }
  #fill { background: #efe6d2; display: none; }
</style>
</head>
<body>
<canvas id="paper" data-flipbook-layer="paper"></canvas>
<div id="fill"></div>
<script type="module">
import { composition, setupCanvas, rng } from '/__flipbook/runtime.js';
const paper = setupCanvas(document.getElementById('paper'), 640, 360);
const fill = document.getElementById('fill');
composition({
  setup() {
    paper.fillStyle = '#efe6d2';
    paper.fillRect(0, 0, 640, 360);
    const r = rng(7);
    for (let i = 0; i < 3000; i++) {
      paper.fillStyle = `rgba(80, 60, 30, ${r.range(0.05, 0.2)})`;
      paper.fillRect(r.range(0, 640), r.range(0, 360), 2, 2);
    }
  },
  seek(t) {
    // No content: every other second a flat fill covers the paper.
    fill.style.display = Math.floor(t) % 2 === 1 ? 'block' : 'none';
  },
});
</script>
</body>
</html>
