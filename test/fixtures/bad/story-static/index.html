<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 320px; height: 180px; overflow: hidden; background: #ffffff; }
  canvas { position: absolute; left: 0; top: 0; }
</style>
</head>
<body>
<canvas id="ink"></canvas>
<script type="module">
import { composition, setupCanvas, timeline } from '/__flipbook/runtime.js';
const tl = await timeline();
const ink = setupCanvas(document.getElementById('ink'), 320, 180);
const SKY = { sun: '#f3d27a', rain: '#8fa3b8', snow: '#e8edf2' };
composition({
  seek(t) {
    const scene = tl.scenes.find((s) => t >= s.start && t < s.end) ?? tl.scenes[tl.scenes.length - 1];
    ink.fillStyle = SKY[scene.id];
    ink.fillRect(0, 0, 320, 180);
    // A boat crossing the frame. It stops dead through the rain, although the story says it sinks there.
    ink.fillStyle = '#7a4b2a';
    const rain = tl.scenes[1];
    const x = t < rain.start ? t : t < rain.end ? rain.start : t - (rain.end - rain.start);
    ink.fillRect(20 + (x / (tl.durationSec - (rain.end - rain.start))) * 260, 110, 40, 16);
  },
});
</script>
</body>
</html>
