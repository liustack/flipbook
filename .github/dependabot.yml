version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # The same window as minimumReleaseAge in pnpm-workspace.yaml.
    cooldown:
      default-days: 3
    commit-message:
      prefix: build
      include: scope
    ignore:
      # playwright-core pins the Chromium build; upgrade it by hand.
      - dependency-name: playwright-core

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
