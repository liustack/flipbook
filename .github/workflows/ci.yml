name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 22.19 is the engines floor, run as that exact version.
        node-version: ['22.19', 24]
    defaults:
      run:
        # Git Bash on Windows, so every step keeps one script.
        shell: bash
    env:
      # win32 exits 78 unless this is set. Only read on Windows.
      FLIPBOOK_ALLOW_WIN32: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - name: Install ffmpeg
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get update && sudo apt-get install -y ffmpeg ;;
            macOS) brew install ffmpeg ;;
            Windows) choco install ffmpeg -y --no-progress ;;
          esac
          ffmpeg -hide_banner -version | head -n 1
      - run: pnpm install --frozen-lockfile
      - name: Locate the flipbook cache
        run: |
          case "$RUNNER_OS" in
            Linux) echo "FLIPBOOK_CACHE=$HOME/.cache/liustack/flipbook" >> "$GITHUB_ENV" ;;
            macOS) echo "FLIPBOOK_CACHE=$HOME/Library/Caches/liustack/flipbook" >> "$GITHUB_ENV" ;;
            Windows) echo "FLIPBOOK_CACHE=${LOCALAPPDATA}\\liustack\\flipbook" >> "$GITHUB_ENV" ;;
          esac
      - uses: actions/cache@v4
        with:
          path: ${{ env.FLIPBOOK_CACHE }}
          key: flipbook-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'src/fonts/manifest.json') }}
      - name: Install the pinned Chromium headless shell
        run: |
          deps=""
          if [ "$RUNNER_OS" = "Linux" ]; then deps="--with-deps"; fi
          PLAYWRIGHT_BROWSERS_PATH="$FLIPBOOK_CACHE/browsers" pnpm exec playwright-core install $deps chromium-headless-shell
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Test
        if: runner.os != 'Windows'
        run: pnpm test
      # Windows is not supported yet. The suites that render, and the ones that
      # drive POSIX-only tools (run.sh, the eval runner's sh shim), may fail
      # there; their report is kept as an artifact. Everything else must pass.
      - name: Build for the Windows tests
        if: runner.os == 'Windows'
        run: pnpm build
      - name: Test on Windows, platform-neutral suites
        if: runner.os == 'Windows'
        env:
          FLIPBOOK_TEST_SKIP_BUILD: '1'
        run: >-
          pnpm exec vitest run
          --exclude test/corpus.test.ts --exclude test/doctor.test.ts
          --exclude test/page.test.ts --exclude test/references.test.ts
          --exclude test/render.test.ts --exclude test/launcher.test.ts
          --exclude test/eval.test.ts
      - name: Test on Windows, rendering and POSIX-only suites (allowed to fail)
        if: runner.os == 'Windows'
        continue-on-error: true
        env:
          FLIPBOOK_TEST_SKIP_BUILD: '1'
        run: >-
          pnpm exec vitest run
          test/corpus.test.ts test/doctor.test.ts test/page.test.ts
          test/references.test.ts test/render.test.ts test/launcher.test.ts
          test/eval.test.ts
          --reporter=default --reporter=github-actions --reporter=junit
          --outputFile.junit=vitest-windows.xml
      - name: Keep the Windows test report
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-tests-node-${{ matrix.node-version }}
          path: vitest-windows.xml
          if-no-files-found: ignore
      - run: pnpm build

  install:
    # INSTALL.md from scratch on a fresh Ubuntu x64 runner. Before a release the
    # npm package and the git tag do not exist yet, so the packed tarball is
    # installed globally and the skill is copied from the checkout.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19'
          cache: pnpm
      - name: Pack the CLI
        run: pnpm install --frozen-lockfile && pnpm build && npm pack --pack-destination "$RUNNER_TEMP"
      - name: Steps 1 and 2, the skill folder
        run: |
          mkdir -p ~/.claude/skills/flipbook
          cp -R skills/flipbook/. ~/.claude/skills/flipbook/
          ls ~/.claude/skills/flipbook/SKILL.md ~/.claude/skills/flipbook/scripts/run.sh ~/.claude/skills/flipbook/references
      - name: Step 3, Node, ffmpeg and the CLI
        run: |
          node --version
          sudo apt-get update && sudo apt-get install -y ffmpeg
          ffmpeg -hide_banner -encoders | grep libx264
          npm install -g "$RUNNER_TEMP"/liustack-flipbook-*.tgz
      - name: Step 4, doctor before the first download exits 78
        run: |
          code=0
          bash ~/.claude/skills/flipbook/scripts/run.sh doctor --json > doctor.json || code=$?
          cat doctor.json
          test "$code" -eq 78
          grep -q chromium-missing doctor.json
      - name: Step 4, check and render hello
        run: |
          HELLO="$RUNNER_TEMP/flipbook-hello"
          cp -R examples/hello "$HELLO"
          code=0
          bash ~/.claude/skills/flipbook/scripts/run.sh check "$HELLO" > check.json 2> check.err || code=$?
          if [ "$code" -eq 78 ] && grep -q linux-deps-missing check.err; then
            cat check.err
            sudo npx --yes playwright-core@1.63.0 install-deps chromium-headless-shell
            code=0
            bash ~/.claude/skills/flipbook/scripts/run.sh check "$HELLO" > check.json 2> check.err || code=$?
          fi
          if [ "$code" -ne 0 ]; then cat check.json check.err; exit 1; fi
          bash ~/.claude/skills/flipbook/scripts/run.sh render "$HELLO" > render.json
          bash ~/.claude/skills/flipbook/scripts/run.sh doctor
          ffprobe -v error -show_entries stream=width,height,pix_fmt,nb_frames:format=duration -of compact "$HELLO/out/video.mp4"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: install-smoke
          path: |
            doctor.json
            check.json
            check.err
            render.json
