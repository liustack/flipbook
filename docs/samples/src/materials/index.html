<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>sample: materials</title>
<style>
  html, body { margin: 0; width: 960px; height: 540px; overflow: hidden; background: #efe5d0; }
  canvas { position: absolute; left: 0; top: 0; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script type="module">
import {
  composition, timeline, setupCanvas, paperLayer, grainLayer, writeText,
  pencil, hatch, crossHatch, halftone, stipple, tornPaper, ellipsePoints,
} from '/__flipbook/runtime.js';

const tl = await timeline();
const ctx = setupCanvas(document.getElementById('stage'), tl.width, tl.height);
const cells = [
  { x: 60, y: 50, label: 'pencil' },
  { x: 360, y: 50, label: 'hatch' },
  { x: 660, y: 50, label: 'crossHatch' },
  { x: 60, y: 290, label: 'halftone' },
  { x: 360, y: 290, label: 'stipple' },
  { x: 660, y: 290, label: 'tornPaper' },
];
const W = 240;
const H = 170;

composition({
  setup() {
    paperLayer(tl.width, tl.height, { seed: 4 });
    grainLayer(tl.width, tl.height, { seed: 4 });
  },
  seek() {
    ctx.clearRect(0, 0, tl.width, tl.height);
    const [a, b, c, d, e, f] = cells.map(({ x, y }) => ({ x, y, width: W, height: H }));
    pencil(ctx, ellipsePoints(a.x + W / 2, a.y + H / 2, 105, 70, -0.2), { closed: true, seed: 2 });
    pencil(ctx, [[a.x + 20, a.y + H - 12], [a.x + W - 20, a.y + H - 22]], { seed: 3, width: 2.4 });
    hatch(ctx, b, { seed: 5, tone: (x) => (x - b.x) / W });
    crossHatch(ctx, c, { seed: 6, layers: 3, tone: (x) => (x - c.x) / W });
    halftone(ctx, d, { seed: 7, color: '#b04a2e', cell: 7, tone: (x) => (x - d.x) / W });
    stipple(ctx, e, { seed: 8, cell: 3, size: [0.5, 1.3], tone: (x, y) => Math.hypot(x - e.x - W / 2, y - e.y - H / 2) / 120 });
    tornPaper(ctx, { x: f.x + 10, y: f.y + 10, width: W - 20, height: H - 20 }, { seed: 9, fill: '#e3d3b0' });
    for (const cell of cells) {
      writeText(ctx, cell.label, cell.x, cell.y + H + 14, { font: '400 22px "LXGW WenKai"', color: '#2b2622' });
    }
  },
});
</script>
</body>
</html>
