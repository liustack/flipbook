<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>brand-intro: 青柿文具</title>
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #f3ebdd; }
  canvas { position: absolute; left: 0; top: 0; }
  #name { position: absolute; left: 0; top: 640px; width: 1920px; margin: 0; text-align: center; opacity: 0;
          font: 600 112px/1.2 var(--brand-title-font); color: var(--brand-ink); letter-spacing: 12px; }
  #sign { position: absolute; left: 0; top: 800px; width: 1920px; margin: 0; text-align: center; opacity: 0;
          font: 400 48px/1.3 var(--brand-text-font); color: var(--brand-secondary); }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<h1 id="name"></h1>
<p id="sign"></p>
<script type="module">
import {
  brand,
  composition,
  cueProgress,
  ease,
  ellipsePoints,
  grainLayer,
  handText,
  paperLayer,
  pencil,
  progress,
  sceneAt,
  setupCanvas,
  staticLayer,
  timeline,
  writeText,
} from '/__flipbook/runtime.js';

const tl = await timeline();
const b = await brand();
const W = tl.width;
const H = tl.height;
const ctx = setupCanvas(document.getElementById('stage'), W, H);
const [mark, line, lockup] = tl.scenes;
const beat = tl.secondsPerBeat;
const name = document.getElementById('name');
const sign = document.getElementById('sign');
name.textContent = b.name;
sign.textContent = b.tagline;
b.applyCss();

// The fruit of the logo when it lands at (960, 520), 420 px wide.
const sketch = ellipsePoints(960, 567, 160, 132, 0, 120);
let ruled;

function drawLogo(c, x, y, size, alpha = 1) {
  c.save();
  c.globalAlpha *= alpha;
  c.drawImage(b.logo, x - size / 2, y - size / 2, size, size);
  c.restore();
}

// Scene "mark": a pencil sketch of the fruit, the logo lands on it, the name writes in.
function drawMark(t) {
  const drawn = ease.inOutSine(progress(t, 0, 3 * beat));
  const land = ease.outBack(progress(t, 3 * beat, 3.6 * beat));
  const slide = ease.inOutCubic(progress(t, 3.7 * beat, 4.9 * beat));
  const cx = 960 - 330 * slide;
  // A slow push over the whole page.
  const zoom = 1 + 0.05 * ease.inOutSine(progress(t, 0, mark.end));
  ctx.save();
  ctx.translate(W / 2, H / 2);
  ctx.scale(zoom, zoom);
  ctx.translate(-W / 2, -H / 2);
  ctx.drawImage(ruled.canvas, 0, 0, W, H);
  const fade = 1 - ease.outCubic(progress(t, 3 * beat, 4 * beat));
  if (fade > 0) {
    // A pale wash in the brand color soaks in while the pencil goes round.
    const wash = ctx.createRadialGradient(930, 540, 20, 960, 567, 190);
    wash.addColorStop(0, b.colors.primary);
    wash.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.globalAlpha = 0.35 * drawn * fade;
    ctx.fillStyle = wash;
    ctx.beginPath();
    ctx.ellipse(960, 567, 150 * (0.6 + 0.4 * drawn), 124 * (0.6 + 0.4 * drawn), 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
    const done = Math.max(2, Math.round(sketch.length * (0.04 + 0.96 * drawn)));
    pencil(ctx, sketch.slice(0, done), {
      seed: tl.seed, width: 3.2, color: b.colors.ink, opacity: 0.85 * fade, passes: 3,
    });
    pencil(ctx, [[960, 437], [964, 400], [983, 366]], {
      seed: tl.seed + 1, width: 3.2, color: b.colors.ink, opacity: 0.85 * fade * drawn,
    });
  }
  if (t >= 3 * beat) drawLogo(ctx, cx, 520, 420 * (0.85 + 0.15 * land), Math.min(1, land * 1.4));
  const p = cueProgress(tl, t, 'name');
  if (p > 0) {
    ctx.fillStyle = b.colors.ink;
    writeText(ctx, b.name, 1180, 430, { id: 'name', font: b.font('title', 132), progress: p, align: 'center' });
    ctx.fillStyle = b.colors.primary;
    ctx.fillRect(1180 - 150 * p, 640, 300 * p, 6);
  }
  ctx.restore();
}

// Scene "line": the tagline written by hand across a ruled page, then underlined.
function drawLine(t) {
  const local = t - line.start;
  ctx.drawImage(ruled.canvas, 0, 0, W, H);
  // The ribbon bookmark sways a little.
  ctx.save();
  ctx.translate(1580, -20);
  ctx.rotate(0.03 * Math.sin(local * 1.6));
  ctx.fillStyle = b.colors.primary;
  ctx.beginPath();
  ctx.moveTo(-34, 0);
  ctx.lineTo(34, 0);
  ctx.lineTo(34, 420);
  ctx.lineTo(0, 386);
  ctx.lineTo(-34, 420);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
  ctx.fillStyle = b.colors.ink;
  handText(ctx, b.tagline, 300, 491, {
    id: 'tagline', font: b.font('text', 104), progress: cueProgress(tl, t, 'tagline'), seed: tl.seed,
  });
  const under = ease.inOutSine(progress(t, line.start + 5.5 * beat, line.start + 7 * beat));
  if (under > 0) {
    pencil(ctx, [[300, 636], [300 + 1120 * under, 630 + 6 * under]], {
      seed: tl.seed + 2, width: 5, color: b.colors.primary, opacity: 0.9, passes: 3,
    });
  }
}

// Scene "lockup": logo, name and line, with a slow halo in the brand color behind.
function drawLockup(t) {
  const local = t - lockup.start;
  const halo = 230 + local * 22;
  ctx.fillStyle = b.colors.primary;
  ctx.globalAlpha = 0.14;
  ctx.beginPath();
  ctx.arc(960, 400, halo, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 0.08;
  ctx.beginPath();
  ctx.arc(960, 400, halo * 1.45, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;
  drawLogo(ctx, 960, 400, 300 + local * 6);
}

composition({
  setup() {
    paperLayer(W, H, { seed: tl.seed, color: b.colors.paper, mottle: 0.7 });
    ruled = staticLayer(W, H, (c) => {
      c.strokeStyle = b.colors.secondary;
      c.globalAlpha = 0.28;
      c.lineWidth = 2;
      for (let y = 250; y < H; y += 120) {
        c.beginPath();
        c.moveTo(0, y);
        c.lineTo(W, y);
        c.stroke();
      }
      c.globalAlpha = 0.6;
      c.strokeStyle = b.colors.primary;
      c.beginPath();
      c.moveTo(220, 0);
      c.lineTo(220, H);
      c.stroke();
    });
    grainLayer(W, H, { seed: tl.seed, amount: 0.6 });
  },
  seek(t) {
    ctx.clearRect(0, 0, W, H);
    const { scene } = sceneAt(tl, t);
    const inLockup = scene.id === 'lockup';
    if (scene.id === 'mark') drawMark(t);
    else if (scene.id === 'line') drawLine(t);
    else drawLockup(t);
    const a = inLockup ? ease.outCubic(cueProgress(tl, t, 'close')) : 0;
    name.style.opacity = String(a);
    name.style.transform = `translateY(${(1 - a) * 20}px)`;
    const s = inLockup ? ease.outCubic(cueProgress(tl, t, 'sign')) : 0;
    sign.style.opacity = String(s);
    sign.style.transform = `translateY(${(1 - s) * 14}px)`;
  },
});
</script>
</body>
</html>
